x-service: &svc
  env_file: [.env.example]
  restart: unless-stopped

services:
  api_gateway:
    <<: *svc
    build: { context: ., args: { MODULE: api_gateway } }
    ports: ["8000:8000"]
    depends_on: [ingestion]
  ingestion:
    <<: *svc
    build: { context: ., args: { MODULE: ingestion } }
    ports: ["8001:8001"]
    depends_on: [processing, redis]
  processing:
    <<: *svc
    build: { context: ., args: { MODULE: processing } }
    ports: ["8002:8002"]
    depends_on: [engine]
  engine:
    <<: *svc
    build: { context: ., args: { MODULE: engine } }
    ports: ["8003:8003"]
  redis:
    image: redis:7-alpine
  mock_webhook:
    image: mendhak/http-https-echo:31
    environment: { HTTP_PORT: "8080" }