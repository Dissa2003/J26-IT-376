name: Ingestion Pipeline CI & Benchmarks

on:
  push:
    branches: [ "main", "dev", "feature/ingestion" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-and-evaluate:
    name: Run Ingestion Test Suite & SLAs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ingestion Unit & Integration Tests
      run: |
        pytest tests/ingestion/ -v --tb=short

    - name: Run Pipeline Ablation & SLA Benchmarking
      run: |
        python -m benchmarks.evaluate_ingestion_ablation
